android.useAndroidX=true
android.enableJetifier=false

android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2

org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m
org.gradle.daemon=false
org.gradle.parallel=false
kotlin.incremental=false
kotlin.daemon.enabled=false

# ARM64/PRoot: use native ARM64 strip instead of broken NDK llvm-strip wrapper
android.stripDebugSymbols=false

# Termux/PRoot network stability
org.gradle.workers.max=1
org.gradle.internal.http.connectionTimeout=60000
org.gradle.internal.http.socketTimeout=180000
org.gradle.internal.repository.max.retries=10
org.gradle.internal.repository.initial.backoff=2000
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
